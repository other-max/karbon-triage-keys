<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Karbon Triage Keys settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header class="page-head">
      <div>
        <h1>Karbon Triage Keys</h1>
        <p class="muted">Keyboard shortcuts for Karbon’s Triage inbox. Changes save as you go and sync to your other Chrome profiles.</p>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </header>

    <section aria-labelledby="general-title">
      <h2 id="general-title">General</h2>
      <div class="card">
        <label class="row">
          <span class="row-text">
            <span class="row-title">Show key hints</span>
            <span class="muted">Key chips next to Karbon’s buttons. Turn individual chips off in the tables below.</span>
          </span>
          <input type="checkbox" id="hintsEnabled">
        </label>

        <fieldset class="row" id="hintStyleRow">
          <legend class="row-text">
            <span class="row-title">Hint style</span>
            <span class="muted">How the key chips look.</span>
          </legend>
          <span class="choices">
            <label class="choice"><input type="radio" name="hintStyle" value="karbon"> <span class="chip chip--karbon">Alt + W</span> Karbon gray</label>
            <label class="choice"><input type="radio" name="hintStyle" value="contrast"> <span class="chip chip--contrast">Alt + W</span> High contrast</label>
          </span>
        </fieldset>

        <label class="row">
          <span class="row-text">
            <span class="row-title">Show the “Shortcuts” link</span>
            <span class="muted">A small link in the bottom-right corner of Karbon that opens the shortcut list.</span>
          </span>
          <input type="checkbox" id="helpLinkEnabled">
        </label>

        <label class="row">
          <span class="row-text">
            <span class="row-title">Show messages</span>
            <span class="muted">Short notes like “No email open” or “Already on My Week” when a shortcut can’t act.</span>
          </span>
          <input type="checkbox" id="toastsEnabled">
        </label>

        <label class="row">
          <span class="row-text">
            <span class="row-title">My Week target</span>
            <span class="muted">Which week the “Add to My Week” shortcut plans the email for.</span>
          </span>
          <select id="myWeekTarget">
            <option value="this">This week</option>
            <option value="next">Next week</option>
          </select>
        </label>
      </div>
    </section>

    <div id="groups"></div>

    <section aria-labelledby="karbon-title">
      <h2 id="karbon-title">Karbon’s built-in shortcuts</h2>
      <p class="muted">For reference. Using one of these for a shortcut above takes it over.</p>
      <div class="card builtins" id="builtins"></div>
    </section>

    <footer class="page-foot">
      <button type="button" class="button" id="reset">Reset everything to defaults</button>
    </footer>
  </main>

  <template id="shortcut-row">
    <div class="shortcut" role="row">
      <span class="shortcut-label" role="cell"></span>
      <span role="cell"><button type="button" class="key-button"></button></span>
      <span role="cell" class="center"><input type="checkbox" class="enabled"></span>
      <span role="cell" class="center"><input type="checkbox" class="hint"></span>
      <span role="cell" class="center"><button type="button" class="link default">Default</button></span>
      <ul class="issues"></ul>
    </div>
  </template>

  <script src="../src/shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
