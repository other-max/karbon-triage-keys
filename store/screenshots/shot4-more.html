<title>Shot 4: more shortcuts</title>

<body>
<div class="copy"><div class="eyebrow"><img src="../icons/icon128.png" alt="">Navica Keys for Karbon</div>
  <h1>Turn on more <mark>when you're ready.</mark></h1>
  <div class="keys">
    <kbd>J</kbd><span>Next email</span><kbd>K</kbd><span>Previous email</span>
    <kbd>R</kbd><span>Reply to all</span><kbd>Shift + R</kbd><span>Reply</span>
    <kbd>F</kbd><span>Forward</span><kbd>L</kbd><span>Save to Later</span>
    <kbd>B</kbd><span>Add a reminder</span><kbd>A</kbd><span>Assign to a colleague</span>
  </div>
</div>
<div class="browser" data-tab="Triage" data-url="app2.karbonhq.com/northwind-cpa/triage" data-scene="triage" data-on="nextEmail prevEmail saveToLater reminder assign reply replyAll forward"></div>
