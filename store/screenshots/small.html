<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile</title>
<link rel="stylesheet" href="shots.css">
<style>
  /* 440x280 tile: icon, name, one line. */
  html, body { width:440px; height:280px; }
  .copy { left:32px; width:380px; }
  .eyebrow { margin-bottom:16px; }
  .eyebrow img { width:56px; height:56px; }
  .copy h1 { font-size:34px; line-height:1.08; margin:0 0 10px; }
  .copy p { font-size:16px; line-height:1.35; }
  .chips { display:flex; gap:8px; margin-top:16px; }
  .chips kbd { font:600 14px/1 ui-monospace, monospace; color:#fff; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.35); border-bottom-width:3px; border-radius:6px; padding:5px 8px; }
</style>
</head>
<body>
<div class="copy">
  <div class="eyebrow"><img src="../icons/icon128.png" alt=""></div>
  <h1>Navica Keys <mark style="background:none;color:var(--mint)">for Karbon</mark></h1>
  <p>Keyboard shortcuts for the Triage inbox.</p>
  <div class="chips"><kbd>E</kbd><kbd>W</kbd><kbd>T</kbd><kbd>?</kbd></div>
</div>
</body>
</html>
